name: Check and deploy server project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring php-xml php-zip
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q -r requirements.txt
      - name: Syntax and regression checks
        run: |
          find app -name '*.php' -print0 | xargs -0 -n 1 php -l
          find app -name '*.js' -print0 | xargs -0 -n 1 node --check
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for folder in ['tools','deploy','tests']:
              for file in Path(folder).rglob('*.py'):
                  ast.parse(file.read_text(encoding='utf-8'),filename=str(file))
          PY
          php -r 'exit(class_exists("ZipArchive") && class_exists("DOMDocument") ? 0 : 1);'
          php tests/vitrine_clipboard_check.php
          php tests/runtime_config_check.php
          .ci-venv/bin/python -m unittest discover -s tests -p 'test_server_*.py'
      - name: Package exact Git source
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/dltk-v3-${GITHUB_SHA}.tar.gz HEAD
          cd artifacts
          sha256sum dltk-v3-${GITHUB_SHA}.tar.gz > dltk-v3-${GITHUB_SHA}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dltk-v3-release-${{ github.sha }}
          path: artifacts/dltk-v3-*
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dltk-v3-server-deploy
      cancel-in-progress: false
    environment:
      name: demo
      url: https://89.208.213.14/dltk-v3/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dltk-v3-release-${{ github.sha }}
          path: artifacts
      - name: Deploy checked source and verify public version
        env:
          DLTK_DEPLOY_SSH_KEY: ${{ secrets.DLTK_DEPLOY_SSH_KEY }}
          DLTK_DEPLOY_KNOWN_HOSTS: ${{ secrets.DLTK_DEPLOY_KNOWN_HOSTS }}
        run: python3 deploy/send_release.py
